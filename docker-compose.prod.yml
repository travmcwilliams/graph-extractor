services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - PYTHONUNBUFFERED=1
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
